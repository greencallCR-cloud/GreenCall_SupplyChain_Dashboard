name: GreenCall Sheets sync (read-only)

# Google Sheets -> validated private snapshot -> Neon (least-privilege sync role).
# Sheets is only READ (spreadsheets.readonly). The repository is public, so this job
# never prints data, row counts, hashes or connection strings: only a status code.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GREENCALL_GOOGLE_SERVICE_ACCOUNT_JSON  service-account key with Viewer access to the sheet
#   GREENCALL_SYNC_DATABASE_URL            gc_sheets_sync role connection string
on:
  # A verified change to the read-only sync code on main should refresh the BI
  # automatically, without requiring the operator to press Run workflow.
  push:
    branches: [main]
    paths:
      - 'src/sheets-sync.mjs'
      - 'tools/sync-cloud.mjs'
      - '.github/workflows/sheets-sync.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greencall-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        id: secrets
        env:
          GOOGLE_JSON: ${{ secrets.GREENCALL_GOOGLE_SERVICE_ACCOUNT_JSON }}
          SYNC_URL: ${{ secrets.GREENCALL_SYNC_DATABASE_URL }}
        run: |
          if [ -z "$GOOGLE_JSON" ] || [ -z "$SYNC_URL" ]; then
            echo "::notice::Sync skipped: GREENCALL_GOOGLE_SERVICE_ACCOUNT_JSON / GREENCALL_SYNC_DATABASE_URL not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --omit=dev
      - name: Read Sheets and publish snapshot
        if: steps.secrets.outputs.ready == 'true'
        env:
          GOOGLE_JSON: ${{ secrets.GREENCALL_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GREENCALL_SYNC_DATABASE_URL: ${{ secrets.GREENCALL_SYNC_DATABASE_URL }}
          GREENCALL_ALLOW_SNAPSHOT_WRITE: '1'
          GREENCALL_SNAPSHOT_ENV: production
          GREENCALL_ALLOW_PRODUCTION_SNAPSHOT: '1'
        run: |
          umask 077
          PRIVATE="$RUNNER_TEMP/greencall-private"
          mkdir -p "$PRIVATE/staging"
          printf '%s' "$GOOGLE_JSON" > "$PRIVATE/google.json"
          set +e
          GREENCALL_GOOGLE_CREDENTIAL_FILE="$PRIVATE/google.json" \
            node tools/sync-cloud.mjs --from-sheets --staging-dir "$PRIVATE/staging" --apply > "$PRIVATE/result.json" 2> "$PRIVATE/error.json"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            node -e "const r=require(process.argv[1]);console.log('sync ok: mode='+r.mode+' new_cuts='+JSON.stringify(r.new_cuts||{}));for(const t of r.held_sources||[])console.log('::warning::Source held for reduction review: '+t)" "$PRIVATE/result.json"
          else
            node -e "try{const r=require(process.argv[1]);console.log('sync failed: stage='+r.stage+' code='+r.code+' detail='+JSON.stringify(r.detail||{}));console.log('::error::Sheets sync '+r.stage+' '+r.code)}catch{console.log('sync failed')}" "$PRIVATE/error.json"
          fi
          rm -rf "$PRIVATE"
          exit "$status"
      - name: Precompute the default view of the new snapshot (public endpoint, timings only)
        if: steps.secrets.outputs.ready == 'true'
        env:
          GREENCALL_WARM_URL: https://greencall-supplychain-dashboard.vercel.app
        run: node tools/warm-views.mjs
