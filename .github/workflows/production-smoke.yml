name: GreenCall production smoke (public + admin)

# Phase 1 always runs ANONYMOUSLY: public consultation must render every public tab, hide the
# admin tabs and deny admin-only APIs. Phase 2 runs only when the repository secret
# GREENCALL_SMOKE_ADMIN_KEY (= Vercel GREENCALL_ADMIN_KEY) exists. Prints aggregate counts only.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (pinned) and Chromium
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Public + admin smoke test
        env:
          GREENCALL_SMOKE_URL: https://greencall-supplychain-dashboard.vercel.app
          GREENCALL_SMOKE_ADMIN_KEY: ${{ secrets.GREENCALL_SMOKE_ADMIN_KEY }}
        run: node tools/prod-smoke.mjs
